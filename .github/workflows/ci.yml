name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      # O client do Prisma só precisa de uma URL válida para ser gerado; nenhum banco é acessado
      - name: Gerar Prisma Client
        run: yarn prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Build
        run: yarn build

      - name: Testes unitários
        run: yarn test:unit --ci
