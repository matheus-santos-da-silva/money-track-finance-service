name: Build & Deploy Finance Service

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/matheus-santos-da-silva/finance-service:latest
            ghcr.io/matheus-santos-da-silva/finance-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Só dispara quando houver servidor: ative com a variável de repositório DEPLOY_ENABLED=true
      - name: Disparar deploy no infra
        if: vars.DEPLOY_ENABLED == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository: matheus-santos-da-silva/money-track-infra
          event-type: deploy
