services:
  postgres-compose:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance-service
    ports:
      - "5434:5432"
    volumes:
      - ./data:/var/lib/postgresql/data

  postgres-test:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance-service-test
    ports:
      - "5435:5432"
volumes:
  data:
